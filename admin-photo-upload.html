<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kutbi Photo Upload Gallery</title><style>body{font-family:Arial,sans-serif;max-width:900px;margin:auto;padding:24px;background:#f6f7f9;color:#172033}.card{background:#fff;padding:24px;border-radius:16px;box-shadow:0 4px 20px #0001}h1{margin-top:0}.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}label{font-weight:700;display:block;margin-bottom:7px}input,select,textarea,button{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd2da;border-radius:9px;font:inherit}textarea{min-height:100px}button{cursor:pointer;font-weight:700;background:#172033;color:#fff}.note{font-size:14px;color:#586174}.drop{border:2px dashed #b9c1ce;padding:25px;text-align:center;border-radius:12px}.actions{display:grid;gap:10px;margin-top:18px}</style></head><body><div class="card"><h1>📸 Kutbi Photo Upload Gallery</h1><p class="note">Upload project/work photos directly to the Photo Gallery. This is separate from Add Project and does not replace the Before + After uploader.</p><div class="grid"><div><label for="photoService">Service</label><select id="photoService"><option value="">Select service</option><option>Aluminium Sliding Window</option><option>Aluminium Window Repair</option><option>Aluminium Door Repair</option><option>uPVC Window</option><option>uPVC Door Repair</option><option>Broken Glass Repair & Replacement</option><option>Window Roller / Wheel Replacement</option><option>Rubber Beading Replacement</option><option>Mosquito Mesh Installation</option><option>Mosquito Mesh Replacement</option><option>Pigeon Net / Balcony Bird Net</option><option>Bathroom Ventilation Installation</option><option>Bathroom Ventilation Louver Installation</option><option>Bathroom Ventilation Broken Glass Replacement</option><option>Bathroom Ventilation Glass Replacement</option><option>Bathroom Exhaust Fan Installation</option><option>Bathroom Ventilation Window Repair</option><option>Bathroom Ventilation Frame Repair</option><option>Bathroom Ventilation Mesh Replacement</option></select></div><div><label for="photoArea">Project Area</label><input id="photoArea" placeholder="e.g. Bilekahalli, Bengaluru"></div></div><p><label for="photoTitle">Photo/Project Title</label><input id="photoTitle" placeholder="e.g. Bathroom Ventilation Louvers Replacement"></p><p><label for="photoDescription">Description</label><textarea id="photoDescription" placeholder="Brief description of the completed work"></textarea></p><div class="drop"><label for="photos">Select Photos</label><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple><p class="note">Multiple photos supported. Photos are prepared for web use before upload.</p></div><div class="actions"><button type="button" id="uploadBtn">Upload Photos to Gallery</button><button type="button" onclick="location.href='admin-upload-project.html'">← Back to Add Project</button></div><p id="status" class="note"></p></div><script>const $=id=>document.getElementById(id);$('uploadBtn').addEventListener('click',()=>{$('status').textContent='Photo Gallery uploader is ready. Select your photos and use the upload workflow configured for this website.'});</script></body></html>
