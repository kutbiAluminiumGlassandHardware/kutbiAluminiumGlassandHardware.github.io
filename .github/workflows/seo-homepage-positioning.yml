name: SEO homepage positioning

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-homepage-positioning.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Strengthen homepage SEO positioning
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '<title>Kutbi Aluminium Glass &amp; Hardware | Aluminium &amp; uPVC Windows &amp; Doors Bangalore</title>':
              '<title>Aluminium &amp; uPVC Window &amp; Door Repair Bangalore | Kutbi</title>',
              '<meta name="description" content="Aluminium &amp; uPVC windows and doors in Bangalore for installation, repair and replacement, plus mosquito mesh, pigeon net and glass services from Kutbi Aluminium Glass &amp; Hardware.">':
              '<meta name="description" content="Kutbi Aluminium Glass &amp; Hardware provides aluminium and uPVC window and door repair in Bangalore, including sliding windows, sliding doors, wheels, rollers, tracks, locks and handles, plus installation and related services.">'
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
      - name: Commit homepage SEO update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'Homepage SEO already current.'; exit 0; fi
          git commit -m 'Strengthen homepage repair SEO metadata [skip ci]'
          git push origin HEAD:main