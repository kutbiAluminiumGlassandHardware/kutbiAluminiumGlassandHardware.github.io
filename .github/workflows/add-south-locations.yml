name: Add South Bengaluru locations to homepage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homepage-location-update
  cancel-in-progress: false

jobs:
  add-south-locations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Update homepage location list
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          locations = [
              'Bannerghatta Road','Gottigere','Kalena Agrahara','Arekere','JP Nagar','Jayanagar','Banashankari',
              'BTM Layout','HSR Layout','Koramangala','Basavanagudi','Hulimavu','Begur','Bommanahalli','Hongasandra',
              'Singasandra','Kudlu Gate','Devarachikkana Halli','Electronic City Phase 1','Electronic City Phase 2',
              'Doddathoguru','Neeladri Road','Konappana Agrahara','Chandapura','Anjanapura','Kanakapura Road',
              'Konanakunte','Vajarahalli','Thalaghattapura','Uttarahalli','Subramanyapura','Vasanthapura',
              'Chikkalasandra','Ittamadu','Padmanabhanagar','Kathriguppe','Hosakerehalli','Rajarajeshwari Nagar',
              'Electronic City','Whitefield','Sarjapur','Marathahalli','Indiranagar','Akshaya Nagar',
              'Arekere MICO Layout','Lakshmi Layout'
          ]
          new_text = ' · '.join(locations)
          # Replace the first homepage location list regardless of the exact previous list.
          pattern = re.compile(r'(Bangalore Service Areas.*?</h2>.*?<p[^>]*>.*?</p>)(.*?)(<[^>]*>View all Bangalore service areas)', re.I | re.S)
          m = pattern.search(s)
          if m:
              block = m.group(2)
              block = re.sub(r'<(?:ul|div)[^>]*>.*?</(?:ul|div)>', '<p class="service-area-list">' + new_text + '</p>', block, count=1, flags=re.I | re.S)
              s = s[:m.start(2)] + block + s[m.end(2):]
          else:
              # Fallback: replace the known old text wherever it appears.
              old = 'Bannerghatta Road · Gottigere · Kalena Agrahara · Arekere · JP Nagar · BTM Layout · Jayanagar · Hulimavu · Begur · Electronic City · HSR Layout · Whitefield · Koramangora · Basavanagudi · Sarjapur · Kudlu Gate · Marathahalli · Indiranagar · Akshaya Nagar · Arekere MICO Layout · Lakshmi Layout'
              if old in s:
                  s = s.replace(old, new_text, 1)
              else:
                  print('Homepage location section not found; stopping without a commit.')
                  raise SystemExit(0)
          p.write_text(s, encoding='utf-8')
          print('Expanded South Bengaluru locations written to homepage.')
          PY

      - name: Commit homepage update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No homepage changes to commit.'
            exit 0
          fi
          git commit -m 'Expand South Bengaluru service areas on homepage'
          git pull --rebase origin main
          git push origin HEAD:main
