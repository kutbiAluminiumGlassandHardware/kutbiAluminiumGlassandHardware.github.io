name: Kutbi AI Project Generator

on:
  repository_dispatch:
    types: [kutbi_ai_project_request]

permissions:
  contents: write

concurrency:
  group: kutbi-ai-project-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate project details securely
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
          PROJECT_PROMPT: ${{ github.event.client_payload.prompt }}
          PROJECT_DATE: ${{ github.event.client_payload.date }}
          PROJECT_SERVICES_JSON: ${{ toJson(github.event.client_payload.services) }}
        shell: python
        run: |
          import json, os, re, time
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          RESULT_DIR=Path('images/projects/ai-results')
          API='https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent'
          if not os.environ.get('GEMINI_API_KEY'): raise SystemExit('Missing GEMINI_API_KEY repository secret.')
          request_id=str(os.environ.get('REQUEST_ID') or '').strip()
          prompt=str(os.environ.get('PROJECT_PROMPT') or '').strip()
          default_date=str(os.environ.get('PROJECT_DATE') or time.strftime('%Y-%m-%d'))
          try: services=json.loads(os.environ.get('PROJECT_SERVICES_JSON') or '[]')
          except Exception: services=[]
          if not request_id or not prompt or not isinstance(services,list) or not services: raise SystemExit('Invalid AI project request.')
          service_text='\\n'.join('- '+str(x) for x in services)
          instruction=f'''You are the content assistant for Kutbi Aluminium Glass & Hardware in Bengaluru, India.
          Convert the user's natural-language project note into the existing Kutbi Add Project fields.

          USER PROJECT NOTE:
          {prompt}

          APPROVED SERVICES — choose exactly one:
          {service_text}

          RULES:
          - Do not invent facts, customer names, building names, measurements, prices, materials, causes, warranties or outcomes.
          - Preserve the full project address stated by the user. Put the complete address in the Project Area field, including project/building name, street/road, layout/area, locality, city, state and PIN code whenever those details are provided. Never shorten a full address and never invent missing address details. If Bangalore is written, standardize it to Bengaluru.
          - Choose the most specific service clearly supported by the user's note.
          - Project title should clearly state the actual work and location, naturally and concisely.
          - Project description should read like a polished ChatGPT-written Kutbi project description: natural, professional, clear and engaging, with the problem/work performed/location/result presented smoothly. Mention the actual repair, replacement, installation, adjustment or other work done and the practical outcome when supported by the user's note. Do not make it sound robotic or like a keyword list.
          - Keep the description around 70-120 words.
          - Create a concise SEO title and meta description.
          - Keywords should be useful phrases directly supported by the project note, service and full project area.
          - Return JSON only with exactly these keys: title, service, area, date, description, seoTitle, seoDescription, keywords
          - date should be {default_date} unless the user explicitly gave another project date.
          - keywords must be an array of 5-12 strings.
          '''
          payload={'contents':[{'parts':[{'text':instruction}]}],'generationConfig':{'responseMimeType':'application/json','maxOutputTokens':1200}}
          rq=Request(API,data=json.dumps(payload).encode(),headers={'x-goog-api-key':os.environ['GEMINI_API_KEY'],'Content-Type':'application/json'},method='POST')
          try:
            with urlopen(rq,timeout=120) as response: data=json.loads(response.read().decode())
          except HTTPError as e:
            raise SystemExit('Gemini API error '+str(e.code)+': '+e.read().decode('utf-8','replace')[:1000])
          candidates=data.get('candidates') or []
          if not candidates: raise SystemExit('Gemini returned no candidates.')
          parts=((candidates[0].get('content') or {}).get('parts') or [])
          output=''.join(str(p.get('text','')) for p in parts if isinstance(p,dict)).strip()
          if not output: raise SystemExit('Gemini returned an empty response.')
          text=re.sub(r'^\\s*\`\`\`(?:json)?\\s*|\\s*\`\`\`\\s*$','',output,flags=re.I|re.S).strip()
          result=json.loads(text); service=str(result.get('service') or '').strip()
          if service not in services: raise SystemExit('AI returned a service outside the approved Add Project list.')
          result={'id':request_id,'ok':True,'title':str(result.get('title') or '').strip(),'service':service,'area':str(result.get('area') or '').strip(),'date':str(result.get('date') or default_date).strip(),'description':str(result.get('description') or '').strip(),'seoTitle':str(result.get('seoTitle') or '').strip(),'seoDescription':str(result.get('seoDescription') or '').strip(),'keywords':[str(x).strip() for x in (result.get('keywords') or []) if str(x).strip()][:12]}
          if not result['title'] or not result['area'] or not result['description']: raise SystemExit('AI returned incomplete project details.')
          RESULT_DIR.mkdir(parents=True,exist_ok=True)
          (RESULT_DIR/(request_id+'.json')).write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

      - name: Save AI result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Kutbi AI Project Generator'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/projects/ai-results
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Generate Kutbi project details'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep $((attempt*2)); continue; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1