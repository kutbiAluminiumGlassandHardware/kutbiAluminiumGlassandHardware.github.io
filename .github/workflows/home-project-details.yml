name: Build full project details on homepage

on:
  push:
    branches:
      - main
    paths:
      - 'images/projects/projects.json'
      - '.github/workflows/home-project-details.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homepage-project-details
  cancel-in-progress: false

jobs:
  update-home:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build homepage project section
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import html

          homepage = Path('index.html')
          projects_file = Path('images/projects/projects.json')

          if not homepage.exists():
              raise SystemExit('index.html not found')
          if not projects_file.exists():
              raise SystemExit('images/projects/projects.json not found')

          page = homepage.read_text(encoding='utf-8')
          raw = json.loads(projects_file.read_text(encoding='utf-8'))
          if not isinstance(raw, list):
              raise SystemExit('projects.json must contain a JSON array')

          def project_id(item):
              try:
                  return int(item.get('id', '0'))
              except (TypeError, ValueError):
                  return 0

          def clean_area(value):
              value = str(value or '').strip()
              replacements = {
                  'White field Bangalore': 'Whitefield, Bengaluru',
                  'White field, Bangalore': 'Whitefield, Bengaluru',
                  'White field': 'Whitefield',
                  'white field bangalore': 'Whitefield, Bengaluru',
                  'white field': 'Whitefield',
                  'Bangalore': 'Bengaluru',
                  'bangalore': 'Bengaluru',
              }
              return replacements.get(value, value)

          def signature(item):
              norm = lambda value: re.sub(r'\s+', ' ', str(value or '').strip().lower())
              return (
                  norm(item.get('title')),
                  norm(item.get('service')),
                  clean_area(item.get('area')).lower(),
                  str(item.get('date', '')).strip(),
              )

          # Sort newest first and remove accidental duplicate records.
          data = []
          seen = set()
          for item in sorted(raw, key=lambda x: (str(x.get('date', '')), project_id(x)), reverse=True):
              sig = signature(item)
              if sig in seen:
                  continue
              seen.add(sig)
              item = dict(item)
              item['area'] = clean_area(item.get('area'))
              data.append(item)

          def esc(value):
              return html.escape(str(value or ''))

          cards = []
          for item in data:
              images = item.get('images') or []
              photos = []
              for image in images:
                  path = image.get('path')
                  if not path:
                      continue
                  image_type = str(image.get('type') or '').lower()
                  label = 'Before' if image_type == 'before' else ('After / Completed Work' if image_type in ('after', 'work', 'completed') else 'Project Photo')
                  alt = image.get('alt') or f"{item.get('service', 'Kutbi project')} in {clean_area(item.get('area', 'Bengaluru'))}"
                  photos.append(
                      f'<div><img src="{esc(path)}" alt="{esc(alt)}" loading="lazy"><small>{esc(label)}</small></div>'
                  )

              description = esc(item.get('description') or item.get('seoDescription'))
              title = item.get('seoTitle') or item.get('title') or 'Kutbi Completed Project'
              service = item.get('service') or 'Kutbi Service'
              area = clean_area(item.get('area') or 'Bengaluru')
              date = item.get('date') or ''
              project_url = f'project.html?id={project_id(item)}' if project_id(item) else 'project-gallery.html'

              cards.append(
                  '<article class="home-project">'
                  f'<h3>{esc(title)}</h3>'
                  '<div class="home-project-meta">'
                  f'<b>🛠️ {esc(service)}</b>'
                  f'<b>📍 {esc(area)}</b>'
                  f'<b>📅 {esc(date)}</b>'
                  '</div>'
                  f'<div class="home-project-photos">{"".join(photos)}</div>'
                  f'<div class="home-project-description">{description.replace(chr(10), "<br>")}</div>'
                  '<div class="home-project-actions">'
                  f'<a class="btn" href="{esc(project_url)}">🔎 View Full Project</a>'
                  '<a class="btn" href="tel:+919979204616">📞 Call Kutbi</a>'
                  '<a class="btn whatsapp" href="https://wa.me/919979204616?text=Hello%20Kutbi%2C%20I%20need%20similar%20work">💬 WhatsApp</a>'
                  '</div>'
                  '</article>'
              )

          section = (
              '<section class="project-gallery"><div class="wrap">'
              '<div class="section-head">'
              '<div class="eyebrow">Real completed work</div>'
              '<h2>See Kutbi’s Real Project Photos &amp; Full Details</h2>'
              '<p>Explore our completed aluminium, uPVC, mosquito mesh, glass and repair projects. Every uploaded project appears here with its photos, service, location, date and full project details.</p>'
              '</div><div class="home-project-list">'
              + ''.join(cards) +
              '</div><p class="center"><a class="btn" href="project-gallery.html">View All Our Projects →</a></p>'
              '</div></section>'
          )

          pattern = r'<section class="project-gallery">.*?</section>'
          if not re.search(pattern, page, flags=re.S):
              raise SystemExit('Existing project-gallery section not found in index.html')
          page = re.sub(pattern, section, page, count=1, flags=re.S)

          if '.home-project-list{' not in page:
              style = '''<style>.home-project-list{display:grid;gap:28px}.home-project{background:#fff;border:1px solid #e1e6ed;border-radius:18px;padding:24px;box-shadow:0 10px 30px rgba(6,24,63,.08)}.home-project h3{font-size:25px;color:#06183f;margin:0 0 12px}.home-project-meta{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:18px}.home-project-meta b{background:#f4f7fb;border-radius:999px;padding:7px 12px;font-size:14px}.home-project-photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.home-project-photos div{overflow:hidden;border-radius:12px;background:#f4f6f8}.home-project-photos img{display:block;width:100%;height:260px;object-fit:cover}.home-project-photos small{display:block;padding:8px 10px;font-weight:800}.home-project-description{margin:18px 0;color:#4d5862;white-space:normal}.home-project-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}@media(max-width:620px){.home-project{padding:17px}.home-project h3{font-size:21px}.home-project-photos img{height:230px}}</style>'''
              page = page.replace('</head>', style + '</head>', 1)

          homepage.write_text(page, encoding='utf-8')
          print(f'Homepage rebuilt from {len(data)} unique project records.')
          PY

      - name: Commit homepage update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage changes required."
            exit 0
          fi
          git commit -m "Update homepage with full project details"
          git push origin HEAD:main
