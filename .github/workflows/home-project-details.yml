name: Build full project details on homepage

on:
  push:
    branches: [main]
    paths:
      - 'images/projects/projects.json'
      - '.github/workflows/home-project-details.yml'
  workflow_dispatch:

permissions:
  contents: write

# All homepage writers share one lock so photo/project updates cannot overwrite each other.
concurrency:
  group: kutbi-homepage-build
  cancel-in-progress: false

jobs:
  update-home:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Validate project data
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('images/projects/projects.json')
          if not p.exists():
              raise SystemExit('projects.json is missing')
          data = json.loads(p.read_text(encoding='utf-8'))
          if not isinstance(data, list):
              raise SystemExit('projects.json must contain a JSON array')
          for i, x in enumerate(data):
              if not isinstance(x, dict):
                  raise SystemExit(f'Project {i} is not an object')
              for im in x.get('images') or []:
                  if not isinstance(im, dict):
                      raise SystemExit(f'Project {i} contains invalid image metadata')
          print(f'Validated {len(data)} project records.')
          PY

      - name: Build homepage project section safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re, html

          homepage = Path('index.html')
          projects_file = Path('images/projects/projects.json')
          page = homepage.read_text(encoding='utf-8')
          raw = json.loads(projects_file.read_text(encoding='utf-8'))

          def pid(x):
              try: return int(x.get('id', 0))
              except Exception: return 0
          def area(v):
              v = str(v or '').strip()
              fixes = {'White field Bangalore':'Whitefield, Bengaluru','White field, Bangalore':'Whitefield, Bengaluru','White field':'Whitefield','white field bangalore':'Whitefield, Bengaluru','white field':'Whitefield','Bangalore':'Bengaluru','bangalore':'Bengaluru'}
              return fixes.get(v, v)
          def norm(v): return re.sub(r'\s+', ' ', str(v or '').strip().lower())
          def esc(v): return html.escape(str(v or ''), quote=True)

          data=[]; seen=set()
          for item in sorted(raw, key=lambda z:(str(z.get('date','')), pid(z)), reverse=True):
              key=(norm(item.get('title')),norm(item.get('service')),area(item.get('area')).lower(),str(item.get('date','')).strip())
              if key in seen: continue
              seen.add(key); item=dict(item); item['area']=area(item.get('area')); data.append(item)

          cards=[]
          for x in data:
              photos=[]
              for im in x.get('images') or []:
                  if not isinstance(im,dict) or not im.get('path'): continue
                  typ=str(im.get('type') or '').lower()
                  label='Before' if typ=='before' else ('After / Completed Work' if typ in ('after','work','completed') else 'Project Photo')
                  alt=im.get('alt') or f"{x.get('service','Kutbi project')} in {area(x.get('area','Bengaluru'))}"
                  photos.append(f'<div><img src="{esc(im["path"])}" alt="{esc(alt)}" loading="lazy"><small>{esc(label)}</small></div>')
              title=x.get('seoTitle') or x.get('title') or 'Kutbi Completed Project'
              desc=esc(x.get('description') or x.get('seoDescription')).replace('\n','<br>')
              service=x.get('service') or 'Kutbi Service'; loc=area(x.get('area') or 'Bengaluru'); date=x.get('date') or ''
              url=f'project.html?id={pid(x)}' if pid(x) else 'project-gallery.html'
              cards.append('<article class="home-project">'+f'<h3>{esc(title)}</h3><div class="home-project-meta"><b>🛠️ {esc(service)}</b><b>📍 {esc(loc)}</b><b>📅 {esc(date)}</b></div><div class="home-project-photos">{"".join(photos)}</div><div class="home-project-description">{desc}</div><div class="home-project-actions"><a class="btn" href="{esc(url)}">🔎 View Full Project</a><a class="btn" href="tel:+919979204616">📞 Call Kutbi</a><a class="btn whatsapp" href="https://wa.me/919979204616?text=Hello%20Kutbi%2C%20I%20need%20similar%20work">💬 WhatsApp</a></div></article>')

          section='<section class="project-gallery"><div class="wrap"><div class="section-head"><div class="eyebrow">Real completed work</div><h2>See Kutbi’s Real Project Photos &amp; Full Details</h2><p>Explore completed aluminium, uPVC, mosquito mesh, glass and repair projects with photos, service, location, date and project details.</p></div><div class="home-project-list">'+''.join(cards)+'</div><p class="center"><a class="btn" href="project-gallery.html">View All Our Projects →</a></p></div></section>'
          pattern=r'<section class="project-gallery">.*?</section>'
          if re.search(pattern,page,re.S): page=re.sub(pattern,section,page,count=1,flags=re.S)
          elif '</main>' in page: page=page.replace('</main>',section+'</main>',1)
          else: raise SystemExit('Could not find safe homepage insertion point; existing homepage was NOT changed')

          if '.home-project-list{' not in page:
              style='<style>.home-project-list{display:grid;gap:28px}.home-project{background:#fff;border:1px solid #e1e6ed;border-radius:18px;padding:24px;box-shadow:0 10px 30px rgba(6,24,63,.08)}.home-project h3{font-size:25px;color:#06183f;margin:0 0 12px}.home-project-meta{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:18px}.home-project-meta b{background:#f4f7fb;border-radius:999px;padding:7px 12px;font-size:14px}.home-project-photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.home-project-photos div{overflow:hidden;border-radius:12px;background:#f4f6f8}.home-project-photos img{display:block;width:100%;height:260px;object-fit:cover}.home-project-photos small{display:block;padding:8px 10px;font-weight:800}.home-project-description{margin:18px 0;color:#4d5862;white-space:normal}.home-project-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}@media(max-width:620px){.home-project{padding:17px}.home-project h3{font-size:21px}.home-project-photos img{height:230px}}</style>'
              if '</head>' not in page: raise SystemExit('Homepage has no </head>; existing homepage was NOT changed')
              page=page.replace('</head>',style+'</head>',1)

          # Final safety checks before touching the real homepage file.
          if page.count('<html') != 1 or '</html>' not in page or '</main>' not in page: raise SystemExit('Generated homepage failed structural validation')
          if '<div class="home-project-photos"></div>' in page: raise SystemExit('Generated homepage contains an empty photo container')
          tmp=homepage.with_suffix('.html.tmp')
          tmp.write_text(page,encoding='utf-8')
          tmp.replace(homepage)
          print(f'Homepage safely rebuilt from {len(data)} unique project records.')
          PY

      - name: Commit homepage update
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No homepage changes required.'
            exit 0
          fi
          git commit -m 'Safely update homepage project details'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Homepage project update pushed on attempt $attempt."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            sleep $((attempt * 2))
          done
          echo 'Could not publish homepage project update after 5 attempts.'
          exit 1
