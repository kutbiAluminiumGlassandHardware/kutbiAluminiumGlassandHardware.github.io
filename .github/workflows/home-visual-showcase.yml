name: Update Homepage Visual Showcase

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "images/projects/projects.json"
      - ".github/workflows/home-visual-showcase.yml"

permissions:
  contents: write

concurrency:
  group: homepage-visual-showcase
  cancel-in-progress: false

jobs:
  showcase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Validate project data and homepage
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f images/projects/projects.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          with open('images/projects/projects.json', encoding='utf-8') as f:
              data = json.load(f)
          if not isinstance(data, list):
              raise SystemExit('projects.json must contain a JSON array')
          html = Path('index.html').read_text(encoding='utf-8')
          required = ['visual-showcase', 'visual-projects', 'images/projects/projects.json']
          missing = [x for x in required if x not in html]
          if missing:
              print('Homepage showcase markers missing:', ', '.join(missing))
              raise SystemExit(1)
          print(f'Validation passed: {len(data)} projects found.')
          PY

      - name: Commit changes if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage changes required."
            exit 0
          fi
          git commit -m "Update homepage visual showcase"
          git push origin HEAD:main
