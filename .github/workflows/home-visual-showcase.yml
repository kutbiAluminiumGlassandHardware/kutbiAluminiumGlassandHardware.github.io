name: Update Homepage Visual Showcase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'images/projects/projects.json'
      - '.github/workflows/home-visual-showcase.yml'

permissions:
  contents: write

concurrency:
  group: homepage-visual-showcase
  cancel-in-progress: false

jobs:
  showcase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Replace quick proof with real project visual showcase
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('<section class="quick-proof">')
          end = s.find('</section>', start) + len('</section>') if start >= 0 else -1

          if start < 0 or end <= start:
              print('Quick-proof section already replaced or not found; no change needed.')
              raise SystemExit(0)

          replacement = r'''<section class="visual-showcase" aria-label="Real Kutbi work project slideshow"><div class="wrap"><div style="text-align:center"><div class="eyebrow">REAL KUTBI WORK</div><h2>See What We Do</h2><p class="section-intro">Real photos from Kutbi's completed projects — window repair, uPVC service, mosquito mesh, glass replacement and more.</p></div><div class="project-home-slider" id="project-home-slider"><button class="project-slide-btn project-prev" type="button" aria-label="Previous project">‹</button><div class="project-home-stage" id="visual-projects"><div class="project-loading">Loading real Kutbi work…</div></div><button class="project-slide-btn project-next" type="button" aria-label="Next project">›</button><div class="project-slide-dots" id="project-slide-dots" aria-label="Project slideshow navigation"></div></div><p class="center" style="margin-top:22px"><a class="btn" href="project-gallery.html">View All Our Projects →</a></p></div><style>.visual-showcase{padding:42px 0;background:#f6f8fb}.project-home-slider{position:relative;max-width:1000px;margin:22px auto 0}.project-home-stage{position:relative;overflow:hidden;border-radius:18px;background:#eef1f4;box-shadow:0 8px 28px rgba(6,24,63,.13);aspect-ratio:16/8;min-height:250px}.visual-card{display:none;position:relative;width:100%;height:100%;background:#fff}.visual-card.active{display:block;animation:kutbiProjectFade .55s ease}.visual-card img{display:block;width:100%;height:100%;object-fit:contain;background:#f1f3f5}.visual-card .vbody{position:absolute;left:0;right:0;bottom:0;padding:65px 22px 18px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.84));pointer-events:none}.visual-card h3{font-size:20px;margin:0 0 6px}.visual-card p{font-size:14px;margin:0}.visual-card a{display:inline-block;margin-top:9px;font-weight:800;color:#fff;pointer-events:auto}.visual-badge{display:inline-block;margin-top:7px;padding:5px 9px;border-radius:20px;background:rgba(255,255,255,.18);font-size:12px;font-weight:800}.project-slide-btn{position:absolute;z-index:3;top:50%;transform:translateY(-50%);width:46px;height:46px;border:0;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 4px 15px rgba(0,0,0,.18);font-size:34px;line-height:40px;cursor:pointer}.project-slide-btn:hover{transform:translateY(-50%) scale(1.06)}.project-prev{left:16px}.project-next{right:16px}.project-slide-dots{display:flex;justify-content:center;gap:7px;margin-top:14px;flex-wrap:wrap}.project-dot{width:9px;height:9px;padding:0;border:0;border-radius:50%;background:#bbb;cursor:pointer}.project-dot.active{background:#333;transform:scale(1.2)}@keyframes kutbiProjectFade{from{opacity:.35}to{opacity:1}}@media(max-width:600px){.visual-showcase{padding:36px 0}.project-home-stage{aspect-ratio:4/3;min-height:230px}.visual-card .vbody{padding:52px 15px 14px}.visual-card h3{font-size:16px}.visual-card p{font-size:12px}.project-slide-btn{width:40px;height:40px;font-size:28px}.project-prev{left:9px}.project-next{right:9px}.project-slide-dots{margin-top:10px}}</style><script>async function loadVisualShowcase(){const stage=document.getElementById('visual-projects'),dots=document.getElementById('project-slide-dots'),slider=document.getElementById('project-home-slider');let items=[],current=0,timer=null;try{const r=await fetch('images/projects/projects.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();items=(Array.isArray(data)?data:[]).sort((a,b)=>new Date(b.date||0)-new Date(a.date||0)||(Number(b.id)||0)-(Number(a.id)||0)).slice(0,8);if(!items.length){stage.innerHTML='<div class="project-loading" style="padding:30px">Real projects will appear here after upload.</div>';return}stage.innerHTML='';dots.innerHTML='';items.forEach((p,i)=>{const img=(p.images||[]).find(x=>x.type==='after')||(p.images||[])[0];if(!img||!img.path)return;const card=document.createElement('article');card.className='visual-card'+(i===0?' active':'');const image=document.createElement('img');image.loading=i===0?'eager':'lazy';image.decoding='async';image.src=img.path;image.alt=img.alt||((p.service||'Kutbi project')+' in '+(p.area||'Bengaluru'));const body=document.createElement('div');body.className='vbody';const h=document.createElement('h3');h.textContent=p.title||p.seoTitle||'Kutbi Completed Project';const badge=document.createElement('span');badge.className='visual-badge';badge.textContent=p.service||'Kutbi Service';const area=document.createElement('p');area.textContent=p.area||'Bengaluru';const link=document.createElement('a');link.href='project.html?id='+encodeURIComponent(p.id);link.textContent='View Full Project →';body.append(h,badge,area,link);card.append(image,body);stage.appendChild(card);const d=document.createElement('button');d.type='button';d.className='project-dot'+(i===0?' active':'');d.setAttribute('aria-label','Show project '+(i+1));d.addEventListener('click',()=>show(i));dots.appendChild(d)});function show(i){const slides=stage.querySelectorAll('.visual-card'),ds=dots.querySelectorAll('.project-dot');if(!slides.length)return;current=(i+items.length)%items.length;slides.forEach((el,n)=>el.classList.toggle('active',n===current));ds.forEach((el,n)=>el.classList.toggle('active',n===current))}function restart(){clearInterval(timer);if(items.length>1)timer=setInterval(()=>show(current+1),4500)}document.querySelector('.project-prev').addEventListener('click',()=>{show(current-1);restart()});document.querySelector('.project-next').addEventListener('click',()=>{show(current+1);restart()});slider.addEventListener('mouseenter',()=>clearInterval(timer));slider.addEventListener('mouseleave',restart);slider.addEventListener('focusin',()=>clearInterval(timer));slider.addEventListener('focusout',restart);let touchX=0;stage.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX},{passive:true});stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-touchX;if(Math.abs(dx)>45){show(current+(dx<0?1:-1));restart()}},{passive:true});restart()}catch(e){stage.innerHTML='<div class="project-loading" style="padding:30px">Project photos are updating. <a href="project-gallery.html">View all our projects →</a></div>'}}loadVisualShowcase();</script></section>'''

          p.write_text(s[:start] + replacement + s[end:], encoding='utf-8')
          PY

      - name: Commit homepage showcase
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Homepage already contains the visual showcase; nothing to commit.'
            exit 0
          fi
          git commit -m 'Show more of project images on homepage'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Homepage showcase pushed successfully on attempt $attempt."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            sleep $((attempt * 2))
          done
          echo 'Unable to push homepage showcase after 5 attempts.'
          exit 1
