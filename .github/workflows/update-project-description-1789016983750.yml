name: Safe Project Description Update 1789016983750

on:
  push:
    paths:
      - '.github/workflows/update-project-description-1789016983750.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update only the project description
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('images/projects/projects.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          target_id = '1789016983750'
          new_description = (
              'Kutbi Aluminium Glass & Hardware completed an aluminium balcony sliding window repair project at Bohra Layout, Gottigere, Bannerghatta Road, Bengaluru. '
              'The aluminium sliding window was stuck and difficult to open and close because the existing rollers and wheels had worn out and were no longer moving correctly. '
              'Our team inspected the sliding mechanism, replaced the damaged window wheels/rollers and carried out alignment and adjustment of the shutter. '
              'The window was then checked for smooth movement, proper alignment and easier opening and closing. '
              'This project is an example of aluminium sliding window repair and wheel replacement work carried out by Kutbi in Gottigere and surrounding Bannerghatta Road areas of Bengaluru.'
          )
          for item in data:
              if str(item.get('id')) == target_id:
                  item['description'] = new_description
                  item['seoDescription'] = new_description
                  break
          else:
              raise SystemExit(f'Project ID {target_id} not found')
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit only the project data change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/projects/projects.json
          git diff --cached --stat
          git diff --cached -- images/projects/projects.json
          git commit -m 'Improve Bohra Layout aluminium sliding window project description'
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/update-project-description-1789016983750.yml
          git add .github/workflows/update-project-description-1789016983750.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Remove temporary project update workflow'
            git push
          fi
