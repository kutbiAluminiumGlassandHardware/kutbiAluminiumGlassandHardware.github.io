name: Add Homepage Photo Gallery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'images/photos/photos.json'
      - '.github/workflows/home-photo-gallery.yml'

permissions:
  contents: write

concurrency:
  group: homepage-photo-gallery
  cancel-in-progress: false

jobs:
  photo-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Add homepage photo gallery section
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'id="homepage-photo-gallery"' in s:
              print('Homepage photo gallery already exists; nothing to add.')
              raise SystemExit(0)

          marker = '<section><div class="wrap"><div class="eyebrow">Our core services</div>'
          pos = s.find(marker)
          if pos < 0:
              print('Core services section marker not found; no change made.')
              raise SystemExit(0)

          section = r'''<section id="homepage-photo-gallery" class="homepage-photo-gallery" aria-label="Kutbi real work photo gallery"><div class="wrap"><div class="section-head" style="text-align:center"><div class="eyebrow">REAL KUTBI WORK PHOTOS</div><h2>Our Work Photo Gallery</h2><p>Browse real photos of Kutbi aluminium and uPVC window repair, door service, mosquito mesh, glass replacement and other completed work across Bengaluru.</p></div><div id="homepage-photo-grid" class="homepage-photo-grid"><div class="project-loading">Loading real Kutbi work photos…</div></div><p class="center" style="margin-top:22px"><a class="btn" href="photo-gallery.html">📸 View All Photos →</a></p></div><style>.homepage-photo-gallery{padding:46px 0;background:#fff}.homepage-photo-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:22px}.homepage-photo-card{position:relative;display:block;overflow:hidden;border-radius:15px;background:#eef1f4;box-shadow:0 6px 20px rgba(6,24,63,.10);aspect-ratio:1/1;text-decoration:none}.homepage-photo-card img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .25s ease}.homepage-photo-card:hover img{transform:scale(1.04)}.homepage-photo-card .photo-label{position:absolute;left:0;right:0;bottom:0;padding:30px 11px 11px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff;font-size:13px;font-weight:800}.homepage-photo-card .photo-area{display:block;font-size:11px;font-weight:600;margin-top:3px;opacity:.9}@media(max-width:900px){.homepage-photo-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:600px){.homepage-photo-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.homepage-photo-gallery{padding:36px 0}}</style><script>async function loadHomepagePhotoGallery(){const box=document.getElementById('homepage-photo-grid');try{const r=await fetch('images/photos/photos.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();const items=(Array.isArray(data)?data:[]).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,12);if(!items.length){box.innerHTML='<div class="project-loading" style="grid-column:1/-1">Real work photos will appear here as you upload them in Add Photos.</div>';return}box.innerHTML='';items.forEach(x=>{if(!x.path)return;const a=document.createElement('a');a.className='homepage-photo-card';a.href='photo-gallery.html';const img=document.createElement('img');img.src=String(x.path).replace(/^\.\//,'').replace(/^\//,'');img.alt=x.alt||((x.service||'Kutbi work')+' in '+(x.area||'Bengaluru')+' - Kutbi Aluminium Glass & Hardware');img.loading='lazy';img.decoding='async';const label=document.createElement('span');label.className='photo-label';label.textContent=x.service||'Kutbi Work';const area=document.createElement('span');area.className='photo-area';area.textContent=x.area||'Bengaluru';label.appendChild(area);a.append(img,label);box.appendChild(a)})}catch(e){box.innerHTML='<div class="project-loading" style="grid-column:1/-1">Photo gallery is updating. <a href="photo-gallery.html">View all photos →</a></div>'}}loadHomepagePhotoGallery();</script></section>'''

          p.write_text(s[:pos] + section + s[pos:], encoding='utf-8')
          PY

      - name: Commit homepage photo gallery
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html

          if git diff --cached --quiet; then
            echo 'No homepage photo gallery change needed.'
            exit 0
          fi

          git commit -m 'Add real work photo gallery to homepage'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Homepage photo gallery pushed successfully on attempt $attempt."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep $((attempt * 2))
          done

          echo 'Unable to push homepage photo gallery after 5 attempts.'
          exit 1
