name: Add Homepage Photo Gallery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'images/photos/photos.json'
      - '.github/workflows/home-photo-gallery.yml'

permissions:
  contents: write

concurrency:
  group: homepage-photo-gallery
  cancel-in-progress: false

jobs:
  photo-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Build homepage photo slideshow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          marker = '<section><div class="wrap"><div class="eyebrow">Our core services</div>'
          pos = s.find(marker)
          if pos < 0:
              print('Core services section marker not found; no change made.')
              raise SystemExit(0)

          start = s.find('<section id="homepage-photo-gallery"')
          if start >= 0:
              end = s.find('</section>', start)
              if end >= 0:
                  end += len('</section>')
                  s = s[:start] + s[end:]
                  pos = s.find(marker)

          section = r'''<section id="homepage-photo-gallery" class="homepage-photo-gallery" aria-label="Kutbi real work photo slideshow"><div class="wrap"><div class="section-head" style="text-align:center"><div class="eyebrow">REAL KUTBI WORK PHOTOS</div><h2>Our Work Photo Gallery</h2><p>Real photos of Kutbi aluminium and uPVC window repair, door service, mosquito mesh, glass replacement and completed work across Bengaluru.</p></div><div class="homepage-photo-slider" id="homepage-photo-slider"><button class="photo-slide-btn photo-prev" type="button" aria-label="Previous photo">‹</button><div class="homepage-photo-stage" id="homepage-photo-stage"><div class="project-loading">Loading real Kutbi work photos…</div></div><button class="photo-slide-btn photo-next" type="button" aria-label="Next photo">›</button><div class="photo-slide-dots" id="photo-slide-dots" aria-label="Photo slideshow navigation"></div></div><p class="center" style="margin-top:22px"><a class="btn" href="photo-gallery.html">📸 View All Photos →</a></p></div><style>.homepage-photo-gallery{padding:46px 0;background:#fff}.homepage-photo-slider{position:relative;max-width:1100px;margin:22px auto 0}.homepage-photo-stage{position:relative;overflow:hidden;border-radius:18px;background:#eef1f4;box-shadow:0 8px 28px rgba(6,24,63,.13);aspect-ratio:16/8;min-height:260px}.homepage-photo-slide{display:none;width:100%;height:100%;position:relative;text-decoration:none;color:inherit}.homepage-photo-slide.active{display:block;animation:kutbiPhotoFade .55s ease}.homepage-photo-slide img{display:block;width:100%;height:100%;object-fit:cover}.homepage-photo-slide .photo-caption{position:absolute;left:0;right:0;bottom:0;padding:70px 24px 22px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.82));font-size:18px;font-weight:800}.homepage-photo-slide .photo-area{display:block;font-size:13px;font-weight:600;margin-top:4px;opacity:.92}.photo-slide-btn{position:absolute;z-index:3;top:50%;transform:translateY(-50%);width:46px;height:46px;border:0;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 4px 15px rgba(0,0,0,.18);font-size:34px;line-height:40px;cursor:pointer}.photo-slide-btn:hover{transform:translateY(-50%) scale(1.06)}.photo-prev{left:16px}.photo-next{right:16px}.photo-slide-dots{display:flex;justify-content:center;gap:7px;margin-top:14px;flex-wrap:wrap}.photo-dot{width:9px;height:9px;padding:0;border:0;border-radius:50%;background:#bbb;cursor:pointer}.photo-dot.active{background:#333;transform:scale(1.2)}@keyframes kutbiPhotoFade{from{opacity:.35}to{opacity:1}}@media(max-width:600px){.homepage-photo-gallery{padding:36px 0}.homepage-photo-stage{aspect-ratio:4/3;min-height:240px}.homepage-photo-slide .photo-caption{font-size:14px;padding:55px 15px 15px}.photo-slide-btn{width:40px;height:40px;font-size:28px}.photo-prev{left:9px}.photo-next{right:9px}.photo-slide-dots{margin-top:10px}}</style><script>async function loadHomepagePhotoSlideshow(){const stage=document.getElementById('homepage-photo-stage'),dots=document.getElementById('photo-slide-dots'),slider=document.getElementById('homepage-photo-slider');let items=[],current=0,timer=null;try{const r=await fetch('images/photos/photos.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();items=(Array.isArray(data)?data:[]).filter(x=>x&&x.path).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,12);if(!items.length){stage.innerHTML='<div class="project-loading" style="padding:30px">Real work photos will appear here as you upload them in Add Photos.</div>';return}stage.innerHTML='';dots.innerHTML='';items.forEach((x,i)=>{const a=document.createElement('a');a.className='homepage-photo-slide'+(i===0?' active':'');a.href='photo-gallery.html';a.setAttribute('aria-label','View photo gallery');const img=document.createElement('img');img.src=String(x.path).replace(/^\.\//,'').replace(/^\//,'');img.alt=x.alt||((x.service||'Kutbi work')+' in '+(x.area||'Bengaluru')+' - Kutbi Aluminium Glass & Hardware');img.loading=i===0?'eager':'lazy';img.decoding='async';const cap=document.createElement('span');cap.className='photo-caption';cap.textContent=x.service||'Kutbi Work';const area=document.createElement('span');area.className='photo-area';area.textContent=x.area||'Bengaluru';cap.appendChild(area);a.append(img,cap);stage.appendChild(a);const d=document.createElement('button');d.type='button';d.className='photo-dot'+(i===0?' active':'');d.setAttribute('aria-label','Show photo '+(i+1));d.addEventListener('click',()=>show(i));dots.appendChild(d)});function show(i){const slides=stage.querySelectorAll('.homepage-photo-slide'),ds=dots.querySelectorAll('.photo-dot');if(!slides.length)return;current=(i+items.length)%items.length;slides.forEach((el,n)=>el.classList.toggle('active',n===current));ds.forEach((el,n)=>el.classList.toggle('active',n===current));}function restart(){clearInterval(timer);if(items.length>1)timer=setInterval(()=>show(current+1),4000)}document.querySelector('.photo-prev').addEventListener('click',()=>{show(current-1);restart()});document.querySelector('.photo-next').addEventListener('click',()=>{show(current+1);restart()});slider.addEventListener('mouseenter',()=>clearInterval(timer));slider.addEventListener('mouseleave',restart);slider.addEventListener('focusin',()=>clearInterval(timer));slider.addEventListener('focusout',restart);let touchX=0;stage.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX},{passive:true});stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-touchX;if(Math.abs(dx)>45){show(current+(dx<0?1:-1));restart()}},{passive:true});restart()}catch(e){stage.innerHTML='<div class="project-loading" style="padding:30px">Photo gallery is updating. <a href="photo-gallery.html">View all photos →</a></div>'}}loadHomepagePhotoSlideshow();</script></section>'''

          p.write_text(s[:pos] + section + s[pos:], encoding='utf-8')
          print('Homepage photo slideshow updated successfully.')
          PY

      - name: Commit homepage photo slideshow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html

          if git diff --cached --quiet; then
            echo 'No homepage photo slideshow change needed.'
            exit 0
          fi

          git commit -m 'Convert homepage photo gallery to automatic slideshow'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Homepage photo slideshow pushed successfully on attempt $attempt."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep $((attempt * 2))
          done

          echo 'Unable to push homepage photo slideshow after 5 attempts.'
          exit 1
