            '1787760089246': {
              'description': 'Kutbi Aluminium Glass & Hardware completed a broken glass replacement project for a window in Bilekahalli, Bengaluru. The damaged glass was carefully removed, the existing frame was checked and cleaned, and suitable replacement glass was fitted securely. The work was completed with proper fitting and a final check to ensure the window was ready for normal use.',
              'seoDescription': 'Broken window glass replacement completed by Kutbi Aluminium Glass & Hardware in Bilekahalli, Bengaluru, with secure fitting and final inspection.'
            },
            '1787760946851': {
              'description': 'Kutbi Aluminium Glass & Hardware completed a mosquito net installation project at Lemon Leaf, Kodigehalli, Krishnarajapuram, Bengaluru. The mosquito mesh was fitted to help prevent mosquitoes and insects from entering while allowing fresh air and ventilation inside. The mesh was installed neatly and checked for proper fit and easy use.',
              'seoTitle': 'Mosquito Net Installation Completed at Lemon Leaf, Kodigehalli, Krishnarajapuram, Bengaluru',
              'seoDescription': 'Mosquito net installation completed by Kutbi Aluminium Glass & Hardware at Lemon Leaf, Kodigehalli, Krishnarajapuram, Bengaluru.'
            },
            '1787678695251': {
