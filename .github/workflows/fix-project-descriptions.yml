              'seoDescription': 'Bathroom broken glass replacement completed by Kutbi Aluminium Glass & Hardware near Meenakshi Temple, Bannerghatta Road, Bengaluru.'
            },
            '1788446885571': {
              'area': 'Hinduja Lakefront Estates, Cave Temple Road, Bannerghatta Road, Hulimavu, Bengaluru',
              'description': 'Kutbi Aluminium Glass & Hardware completed a Velcro mosquito mesh installation project at Hinduja Lakefront Estates, Cave Temple Road, Bannerghatta Road, Hulimavu, Bengaluru. The mesh was measured and fitted to the existing opening with secure Velcro fixing, neat edge finishing and proper fit. The removable mesh helps keep mosquitoes and insects outside while allowing fresh air and natural ventilation.',
              'seoDescription': 'Velcro mosquito mesh installation completed at Hinduja Lakefront Estates, Hulimavu, Bengaluru by Kutbi Aluminium Glass & Hardware.'
            },
            '1788955764693': {
              'area': 'SLV Crystal, Begur–Koppa Road, Suraksha Nagar, Yelenahalli, Akshayanagar, Bengaluru',
              'seoTitle': 'Bathroom Ventilation Louver Replacement at SLV Crystal, Akshayanagar, Bengaluru',
              'seoDescription': 'Bathroom ventilation louver replacement completed at SLV Crystal, Akshayanagar, Bengaluru by Kutbi Aluminium Glass & Hardware.'
            },
            '1788680199111': {
              'title': 'Aluminium Sliding Window Stuck Repair & Service in Begur, Bengaluru',
              'seoTitle': 'Aluminium Sliding Window Stuck Repair & Service in Begur, Bengaluru'
            },
            '1787474753030': {
              'description': 'Kutbi Aluminium Glass & Hardware completed a mosquito net replacement and installation project at BTM 4th Stage, Bengaluru. The damaged mosquito mesh was removed and replaced with a neatly fitted solution to improve protection from mosquitoes and insects while maintaining airflow. The finished installation was checked for secure fitting and convenient day-to-day use.',
              'seoDescription': 'Mosquito net replacement and installation completed by Kutbi Aluminium Glass & Hardware at BTM 4th Stage, Bengaluru.'
            }
          }

          changed = 0
          for project in projects:
              update = updates.get(str(project.get('id')))
              if not update:
                  continue
              for key, value in update.items():
                  if project.get(key) != value:
                      project[key] = value
                      changed += 1

          path.write_text(json.dumps(projects, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Updated {changed} project fields.')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/projects/projects.json
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Improve Project Gallery descriptions and metadata'
            git push
          fi

      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-project-descriptions.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u .github/workflows/fix-project-descriptions.yml
          if git diff --cached --quiet; then
            echo 'Temporary workflow already removed.'
          else
            git commit -m 'Remove temporary project maintenance workflow'
            git push
          fi
