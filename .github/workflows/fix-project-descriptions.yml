name: Fix Project Gallery Descriptions

on:
  push:
    paths:
      - '.github/workflows/fix-project-descriptions.yml'

permissions:
  contents: write

jobs:
  fix-projects:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update project descriptions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('images/projects/projects.json')
          projects = json.loads(path.read_text(encoding='utf-8'))

          updates = {
            '1788893524046': {
