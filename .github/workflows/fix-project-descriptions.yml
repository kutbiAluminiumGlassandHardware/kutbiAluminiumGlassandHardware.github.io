              'seoTitle': 'Aluminium Window Lock Replacement in Bengaluru',
              'seoDescription': 'Aluminium window lock replacement completed by Kutbi Aluminium Glass & Hardware in Bengaluru, with hardware adjustment and final operation testing.'
