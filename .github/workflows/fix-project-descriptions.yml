            '1787760634727': {
              'area': 'Kothnur, Bengaluru, Karnataka 560076',
              'description': 'Kutbi Aluminium Glass & Hardware completed a uPVC sliding window installation project in Kothnur, Bengaluru. The window was installed with proper frame fitting, shutter alignment and hardware adjustment for smooth operation. The completed installation was checked for secure fitting, easy opening and closing, and a neat finish.',
              'seoDescription': 'uPVC sliding window installation completed by Kutbi Aluminium Glass & Hardware in Kothnur, Bengaluru, with proper fitting, alignment and smooth operation.'
            },
            '1787760376597': {
              'description': 'Kutbi Aluminium Glass & Hardware completed a uPVC sliding window wheel replacement and track repair project in Kalena Agrahara, Bengaluru. Worn-out wheels were replaced, the sliding track was serviced, and the shutter alignment was adjusted to restore smooth opening and closing. The window was tested after repair to ensure proper movement and reliable operation.',
              'seoTitle': 'uPVC Sliding Window Wheel Replacement & Track Repair in Kalena Agrahara, Bengaluru',
              'seoDescription': 'uPVC sliding window wheel replacement and track repair completed by Kutbi Aluminium Glass & Hardware in Kalena Agrahara, Bengaluru.'
