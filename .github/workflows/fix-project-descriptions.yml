              'seoDescription': 'uPVC sliding window installation completed by Kutbi Aluminium Glass & Hardware at Classic Orchards Layout, Kalena Agrahara, Bengaluru, with proper fitting, alignment and smooth operation.'
            },
            '1788892382430': {
