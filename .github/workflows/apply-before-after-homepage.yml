name: Add premium Before After section

on:
  push:
    paths:
      - '.github/workflows/apply-before-after-homepage.yml'

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Before After section
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<section id="homepage-photo-gallery"'

          if 'id="kutbi-before-after"' in text:
              print('Before After section already exists.')
              raise SystemExit(0)

          section = r'''<section id="kutbi-before-after" class="before-after-section" aria-label="Kutbi real before and after repair work"><div class="wrap"><div class="before-after-heading"><div class="eyebrow">REAL REPAIR RESULTS</div><h2>See the Kutbi Difference</h2><p>Real Before → After results from Kutbi aluminium and uPVC window, door and mosquito mesh work across Bengaluru.</p></div><div class="before-after-grid" id="before-after-grid"><div class="before-after-loading">Loading real Before → After work…</div></div><div class="before-after-cta"><a class="btn" href="project-gallery.html">View More Real Repairs →</a><a class="before-after-photo-cta" href="https://wa.me/919979204616?text=Hello%20Kutbi%2C%20I%20am%20sharing%20a%20photo%20for%20a%20repair%20quote">📸 Send Your Window Photo</a></div></div><style>.before-after-section{padding:76px 20px;background:linear-gradient(180deg,#f7f9fc 0%,#fff 100%)}.before-after-heading{text-align:center;max-width:850px;margin:0 auto}.before-after-heading h2{margin:8px 0 10px}.before-after-heading p{margin:0;color:#59636e;font-size:17px;line-height:1.65}.before-after-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin:34px auto 0;max-width:1100px}.before-after-card{background:#fff;border:1px solid #e4e9ef;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(6,24,63,.09);transition:transform .2s ease,box-shadow .2s ease}.before-after-card:hover{transform:translateY(-3px);box-shadow:0 15px 36px rgba(6,24,63,.13)}.before-after-images{display:grid;grid-template-columns:1fr 1fr;background:#eef1f4}.before-after-panel{position:relative;min-width:0}.before-after-panel img{display:block;width:100%;height:245px;object-fit:cover}.before-after-label{position:absolute;top:12px;left:12px;padding:7px 11px;border-radius:999px;background:rgba(6,24,63,.9);color:#fff;font-size:12px;font-weight:900;letter-spacing:.03em}.before-after-label.after{background:#168b57}.before-after-info{padding:18px 19px 20px}.before-after-info h3{margin:0 0 7px;font-size:19px;color:#06183f}.before-after-meta{margin:0;color:#59636e;font-size:14px;font-weight:700}.before-after-status{display:inline-block;margin-top:12px;padding:7px 10px;border-radius:999px;background:#eef7f2;color:#168b57;font-size:12px;font-weight:900}.before-after-loading{padding:22px;text-align:center;background:#fff;border-radius:14px;color:#59636e}.before-after-cta{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:28px}.before-after-cta .btn{margin:0}.before-after-photo-cta{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 20px;border-radius:10px;background:#168b57;color:#fff;font-weight:800;text-decoration:none;box-shadow:0 8px 20px rgba(22,139,87,.2)}.before-after-photo-cta:hover{transform:translateY(-2px);text-decoration:none}@media(max-width:700px){.before-after-section{padding:56px 16px}.before-after-grid{grid-template-columns:1fr;gap:18px;margin-top:26px}.before-after-images{grid-template-columns:1fr 1fr}.before-after-panel img{height:190px}.before-after-info{padding:15px}.before-after-info h3{font-size:17px}.before-after-heading p{font-size:16px}.before-after-cta{display:grid;grid-template-columns:1fr}.before-after-cta .btn,.before-after-photo-cta{width:100%}}@media(max-width:430px){.before-after-panel img{height:165px}.before-after-label{top:8px;left:8px;padding:6px 8px;font-size:10px}}</style><script>async function loadBeforeAfter(){const box=document.getElementById('before-after-grid');try{const r=await fetch('images/projects/projects.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();const items=(Array.isArray(data)?data:[]).filter(p=>{const imgs=Array.isArray(p.images)?p.images:[];return imgs.some(x=>x&&x.type==='before'&&x.path)&&imgs.some(x=>x&&x.type==='after'&&x.path)}).sort((a,b)=>new Date(b.date||0)-new Date(a.date||0)||(Number(b.id)||0)-(Number(a.id)||0)).slice(0,4);if(!items.length){box.innerHTML='<div class="before-after-loading">Real Before → After repair results will appear here as more paired project photos are uploaded.</div>';return}box.innerHTML='';items.forEach(p=>{const before=(p.images||[]).find(x=>x.type==='before'),after=(p.images||[]).find(x=>x.type==='after');const card=document.createElement('article');card.className='before-after-card';card.innerHTML='<div class="before-after-images"><div class="before-after-panel"><img loading="lazy"><span class="before-after-label">BEFORE</span></div><div class="before-after-panel"><img loading="lazy"><span class="before-after-label after">AFTER</span></div></div><div class="before-after-info"><h3></h3><p class="before-after-meta"></p><span class="before-after-status">✓ Completed by Kutbi</span></div>';const imgs=card.querySelectorAll('img');imgs[0].src=before.path;imgs[0].alt=before.alt||((p.service||'Window repair')+' before repair in '+(p.area||'Bengaluru')+' - Kutbi Aluminium Glass & Hardware');imgs[1].src=after.path;imgs[1].alt=after.alt||((p.service||'Window repair')+' after repair in '+(p.area||'Bengaluru')+' - Kutbi Aluminium Glass & Hardware');card.querySelector('h3').textContent=p.service||p.title||'Window & Door Repair';card.querySelector('.before-after-meta').textContent=(p.area||'Bengaluru')+' • '+(p.title||'Real Kutbi completed work');box.appendChild(card)})}catch(e){box.innerHTML='<div class="before-after-loading">Before → After photos are updating. <a href="project-gallery.html">View all real projects →</a></div>'}}loadBeforeAfter();</script></section>'''

          if marker not in text:
              raise SystemExit('Homepage gallery marker not found; no changes made.')

          text = text.replace(marker, section + marker, 1)
          path.write_text(text, encoding='utf-8')
          print('Before After section inserted.')
          PY

      - name: Commit homepage change
        run: |
          if git diff --quiet -- index.html; then
            echo 'No homepage change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add real Before After repair results to homepage'
          git push

      # Triggered intentionally after the workflow file is present on main.
