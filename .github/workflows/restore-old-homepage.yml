name: Restore exact previous homepage

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/restore-old-homepage.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore index.html from exact previous homepage commit
        run: |
          git fetch origin 3b0411a2d92752a36ce0a56cc43c9bc80ccddec2 --no-tags
          git checkout 3b0411a2d92752a36ce0a56cc43c9bc80ccddec2 -- index.html

      - name: Commit exact homepage restore and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/restore-old-homepage.yml
          git commit -m "Restore exact previous Kutbi homepage"
          git push origin HEAD:main
