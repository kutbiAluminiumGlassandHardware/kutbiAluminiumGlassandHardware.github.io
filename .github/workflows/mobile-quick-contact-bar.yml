name: Mobile quick contact bar
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, 'mobile quick bar') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('styles.css');s=p.read_text();m='/* mobile quick bar */'
          if m not in s:
            s += '\n'+m+'\n@media(max-width:620px){body{padding-bottom:76px}.hero-actions .btn:first-child{position:fixed;z-index:9999;left:10px;bottom:10px;width:calc((100vw - 32px)/3);min-height:54px;margin:0;display:flex;align-items:center;justify-content:center;font-size:14px}.hero-actions .whatsapp{position:fixed;z-index:9999;left:calc(10px + (100vw - 32px)/3 + 6px);bottom:10px;width:calc((100vw - 32px)/3);min-height:54px;margin:0;display:flex;align-items:center;justify-content:center;font-size:14px}.hero-card .btn.full{position:fixed;z-index:9999;right:10px;bottom:10px;width:calc((100vw - 32px)/3);min-height:54px;margin:0;display:flex;align-items:center;justify-content:center;font-size:14px;background:#0b5cab}}'
            p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add styles.css && git commit -m 'mobile quick bar' && git push
