name: Mobile quick contact bar

on:
  push:
    branches: [main]
    paths:
      - 'styles.css'
      - 'index.html'
      - '.github/workflows/mobile-quick-contact-bar.yml'

permissions:
  contents: write

jobs:
  update:
    # Never run again on the bot's own fix commit.
    if: ${{ !contains(github.event.head_commit.message, 'Fix mobile quick contact bar') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure mobile quick contact bar CSS
        shell: python
        run: |
          from pathlib import Path

          p = Path('styles.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* mobile quick bar */'
          block = '''
          /* mobile quick bar */
          @media(max-width:620px){
            body{padding-bottom:76px}
            .mobile-quick-bar{
              position:fixed;
              left:10px;
              right:10px;
              bottom:10px;
              z-index:9999;
              display:grid;
              grid-template-columns:1fr 1fr 1fr;
              gap:7px;
              padding:7px;
              background:rgba(6,24,63,.96);
              border:1px solid rgba(255,255,255,.16);
              border-radius:16px;
              box-shadow:0 10px 30px rgba(0,0,0,.28);
              backdrop-filter:blur(8px)
            }
            .mobile-quick-bar a{
              min-height:52px;
              display:flex;
              align-items:center;
              justify-content:center;
              gap:5px;
              border-radius:11px;
              color:#fff;
              font-size:14px;
              font-weight:800;
              text-decoration:none;
              line-height:1.1;
              text-align:center
            }
            .mobile-quick-bar a:nth-child(1){background:#f28c00}
            .mobile-quick-bar a:nth-child(2){background:#168b57}
            .mobile-quick-bar a:nth-child(3){background:#0b5cab}
            .mobile-quick-bar a:active{transform:translateY(1px)}
          }
          '''
          if marker not in s:
              s += block
              p.write_text(s, encoding='utf-8')

      - name: Commit only when files changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix mobile quick contact bar"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 3
          done
          echo "Unable to push after 3 attempts"
          exit 1
