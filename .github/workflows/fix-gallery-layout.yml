name: Fix project gallery photo layout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix-gallery-layout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add horizontal project photo grid CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('styles.css')
          s = p.read_text()
          marker = '/* Kutbi project gallery horizontal photo grid */'
          if marker not in s:
              s += '''\n\n/* Kutbi project gallery horizontal photo grid */\n.project-media{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:stretch}\n.project-media .photo{margin:0;position:relative;overflow:hidden;border-radius:10px;cursor:pointer;background:#f4f6f9}\n.project-media .photo img{display:block;width:100%;height:180px;object-fit:cover;border-radius:10px}\n.project-media .photo-label{position:absolute;left:7px;bottom:7px;padding:4px 7px;border-radius:6px;background:rgba(6,24,63,.86);color:#fff;font-size:11px;font-weight:800;line-height:1.2}\n.project-media .photo:hover img{transform:scale(1.03)}\n.project-media .photo img{transition:transform .2s ease}\n@media(max-width:900px){.project-media{grid-template-columns:repeat(3,minmax(0,1fr))}.project-media .photo img{height:150px}}\n@media(max-width:620px){.project-media{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.project-media .photo img{height:150px}}\n.project-media.single{grid-template-columns:minmax(0,520px)}\n'''
              p.write_text(s)
          PY
      - name: Commit layout fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git diff --cached --quiet || git commit -m "Fix project gallery horizontal photo grid"
          git push
