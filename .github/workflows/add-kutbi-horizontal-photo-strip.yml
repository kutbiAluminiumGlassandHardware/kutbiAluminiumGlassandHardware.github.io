name: Add Kutbi horizontal photo strip
on:
  push:
    branches: [main]
    paths:
      - 'trigger-kutbi-horizontal-photo-strip.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build horizontal photo strip
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import html
          import re
          root=Path('.')
          index=root/'index.html'
          css=root/'header-photo-slider.css'
          project_dir=root/'images'/'projects'
          files=sorted(project_dir.glob('*.jpg'),key=lambda p:p.name,reverse=True)[:10]
          if len(files)<10: raise SystemExit(f'Only {len(files)} project photos found; need at least 10.')
          def alt_from_name(p):
              s=re.sub(r'^\d+-','',p.stem).replace('-',' ').replace('_',' ')
              return 'Kutbi '+re.sub(r'\s+',' ',s).strip()[:150]
          imgs=''.join(f'<img src="{html.escape(str(p.relative_to(root)).replace(chr(92),"/"))}" alt="{html.escape(alt_from_name(p))}" loading="lazy" decoding="async">' for p in files)
          strip='<section class="kutbi-photo-strip" aria-label="Kutbi recent work photos"><div class="kutbi-photo-strip-viewport"><div class="kutbi-photo-strip-track">'+imgs+imgs+'</div></div></section>'
          text=index.read_text(encoding='utf-8')
          text=re.sub(r'<section class="kutbi-photo-strip"[\s\S]*?</section>','',text,count=1)
          if 'href="header-photo-slider.css"' not in text: text=text.replace('</head>','<link rel="stylesheet" href="header-photo-slider.css"></head>',1)
          text=text.replace('</header>','</header>'+strip,1)
          index.write_text(text,encoding='utf-8')
          css.write_text('''/* Kutbi compact horizontal work-photo strip */
.kutbi-photo-strip{width:100%;overflow:hidden;background:#fff;padding:8px 0;border-bottom:1px solid #e8edf3;position:relative;z-index:2}.kutbi-photo-strip-viewport{width:100%;overflow:hidden}.kutbi-photo-strip-track{display:flex;width:max-content;gap:8px;will-change:transform;animation:kutbiPhotoStripMove 34s linear infinite}.kutbi-photo-strip-track img{display:block;width:104px;height:58px;flex:0 0 104px;object-fit:cover;border-radius:8px;border:1px solid #e1e6ed;box-shadow:0 3px 10px rgba(6,24,63,.14)}.kutbi-photo-strip:hover .kutbi-photo-strip-track{animation-play-state:paused}@keyframes kutbiPhotoStripMove{from{transform:translateX(calc(-50% - 4px))}to{transform:translateX(0)}}@media(max-width:1100px){.kutbi-photo-strip-track img{width:88px;height:52px;flex-basis:88px}}@media(max-width:620px){.kutbi-photo-strip{padding:6px 0}.kutbi-photo-strip-track{gap:6px;animation-duration:28s}.kutbi-photo-strip-track img{width:72px;height:44px;flex-basis:72px;border-radius:7px}}@media(prefers-reduced-motion:reduce){.kutbi-photo-strip-track{animation:none!important}}
''',encoding='utf-8')
          PY
      - name: Commit site changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html header-photo-slider.css
          if git diff --cached --quiet; then echo 'No site changes needed.'; exit 0; fi
          git commit -m 'Add compact horizontal Kutbi work photo strip'
          git push
