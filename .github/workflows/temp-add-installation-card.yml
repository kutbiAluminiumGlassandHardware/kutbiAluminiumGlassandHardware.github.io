name: Add installation service card
on:
  push:
    paths:
      - '.github/workflows/temp-add-installation-card.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add installation card safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<div class="card"><span class="card-icon">🦟</span><h3>Mosquito Mesh Installation &amp; Replacement</h3>'
          card = '<div class="card"><span class="card-icon">🛠️</span><h3>Aluminium &amp; uPVC Sliding Window &amp; Door Installation</h3><p>New installation of aluminium and uPVC sliding windows and doors for homes, apartments, offices and other suitable properties, with proper frame fitting, sliding operation and hardware adjustment.</p><a href="services.html">Explore window &amp; door installation →</a></div>'
          if card in s:
              print('Installation card already present; no change needed.')
          elif marker in s:
              s = s.replace(marker, card + marker, 1)
              p.write_text(s, encoding='utf-8')
              print('Installation card added before Mosquito Mesh card.')
          else:
              raise SystemExit('Target service-card marker not found; file was not changed.')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/temp-add-installation-card.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Add aluminium and uPVC sliding window and door installation service card'
            git push
          fi
