name: Finalize Kutbi project SEO data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-project-seo.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Finalize project SEO fields
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, re
          from pathlib import Path
          path = Path('images/projects/projects.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          for p in data:
              title = re.sub(r'\s+', ' ', str(p.get('title',''))).strip()
              service = re.sub(r'\s+', ' ', str(p.get('service',''))).strip()
              area = re.sub(r'\s+', ' ', str(p.get('area',''))).strip()
              if title:
                  p['seoTitle'] = title
              if service and area:
                  for img in p.get('images', []) or []:
                      kind = str(img.get('type','')).lower()
                      label = 'before' if kind == 'before' else ('after' if kind == 'after' else 'completed work')
                      img['alt'] = f'{service} in {area} - {label} - Kutbi Aluminium Glass & Hardware'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Finalized SEO titles and image ALT text for {len(data)} projects.')
          PY
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/projects/projects.json
          git rm .github/workflows/finalize-project-seo.yml
          git commit -m 'Finalize Kutbi project SEO titles and image alt text'
          git push origin HEAD:main
