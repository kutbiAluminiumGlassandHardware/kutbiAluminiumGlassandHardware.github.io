name: One-time Kutbi project data cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-project-data.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Clean project data
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, re
          from pathlib import Path

          path = Path('images/projects/projects.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          if not isinstance(data, list):
              raise SystemExit('projects.json is not a JSON array')

          def clean_space(s):
              s = re.sub(r'\s+', ' ', s or '').strip()
              s = re.sub(r',\s*,+', ', ', s)
              return s.strip(' ,')

          changed = 0
          for p in data:
              title = clean_space(p.get('title', ''))
              service = clean_space(p.get('service', ''))
              area = clean_space(p.get('area', ''))
              desc = clean_space(p.get('description', ''))

              if not area:
                  m = re.search(r'project (?:at|in) (.+?)(?:\.\s|$)', desc, re.I)
                  if not m:
                      m = re.search(r'\b(?:at|in) (.+?)(?:, Bengaluru|, Bangalore|\s+in Bengaluru|\s+in Bangalore)', title, re.I)
                      if m:
                          candidate = m.group(1) + (', Bengaluru' if re.search('Bengaluru', title, re.I) else ', Bangalore')
                      else:
                          candidate = ''
                  else:
                      candidate = m.group(1)
                      if not re.search(r'\bBengaluru\b|\bBangalore\b', candidate, re.I):
                          candidate += ', Bengaluru'
                  candidate = clean_space(candidate)
                  if candidate:
                      p['area'] = area = candidate
                      changed += 1

              if len(desc) < 220 and service and area:
                  extra = f" The work was completed with careful fitting, alignment and final checks for proper operation and a neat finish at {area}."
                  if extra.strip() not in desc:
                      p['description'] = desc + extra
                      desc = p['description']
                      changed += 1

              if not clean_space(p.get('seoDescription', '')) and desc:
                  first = re.split(r'(?<=[.!?])\s+', desc)[0]
                  p['seoDescription'] = first[:300]
                  changed += 1

              if not clean_space(p.get('seoTitle', '')) and title:
                  p['seoTitle'] = title[:70].rstrip(' |,-')
                  changed += 1

              if service and area:
                  normalized_area = clean_space(area)
                  for img in p.get('images', []) or []:
                      alt = clean_space(img.get('alt', ''))
                      bad = (not alt) or (' in - ' in alt) or ('Bengaluru, Karnataka, Bengaluru' in alt) or ('Bangalore, Bengaluru' in alt)
                      if bad:
                          state = 'before' if str(img.get('type', '')).lower() == 'before' else ('after' if str(img.get('type', '')).lower() == 'after' else 'completed work')
                          img['alt'] = f"{service} in {normalized_area} - {state} - Kutbi Aluminium Glass & Hardware"
                          changed += 1

              for key in ('title','service','area','description','seoTitle','seoDescription'):
                  if key in p and isinstance(p[key], str):
                      cleaned = clean_space(p[key])
                      if cleaned != p[key]:
                          p[key] = cleaned
                          changed += 1

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Project records scanned: {len(data)}; field corrections made: {changed}')
          PY

      - name: Commit cleanup and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/projects/projects.json
          git rm .github/workflows/cleanup-project-data.yml
          if git diff --cached --quiet; then
            echo 'No cleanup changes were required.'
            exit 0
          fi
          git commit -m 'Clean and improve Kutbi project gallery data'
          git push origin HEAD:main

# one-time trigger
