name: One-time Lock Project Content Update

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  update-lock-project:
    if: contains(github.event.issue.title, 'KUTBI-LOCK-CONTENT-UPDATE')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update only the Lock replacement project
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('images/projects/projects.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          new_description = (
              'Kutbi Aluminium Glass & Hardware completed an aluminium window lock replacement project in Bengaluru on 1 September 2026. '
              'The existing aluminium window lock required replacement to restore reliable locking and smooth operation. '
              'Our team inspected the window hardware, removed the faulty lock, fitted a suitable replacement lock and checked the locking mechanism after installation. '
              'The completed work restored secure closing and easier day-to-day operation of the aluminium window. '
              'Kutbi provides aluminium window lock repair and replacement, handle replacement, wheel and roller replacement, track servicing, alignment and aluminium and uPVC windows repair across Bengaluru.'
          )
          matches = [item for item in data if item.get('title') == 'Lock replacement']
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one Lock replacement project, found {len(matches)}')
          item = matches[0]
          item['description'] = new_description
          item['seoDescription'] = new_description
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit project-only data change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/projects/projects.json
          git commit -m 'Improve aluminium window lock replacement project description'
          git push
      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --comment 'Project description updated safely; existing project fields and photos preserved.'
      - name: Remove this temporary workflow
        run: |
          rm -f .github/workflows/one-time-lock-project-update.yml
          git add .github/workflows/one-time-lock-project-update.yml
          git commit -m 'Remove one-time lock project updater'
          git push
