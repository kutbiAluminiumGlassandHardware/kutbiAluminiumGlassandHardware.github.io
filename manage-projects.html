<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Projects | Kutbi Aluminium Glass & Hardware</title><meta name="description" content="Private project management page for Kutbi Aluminium Glass & Hardware."><link rel="stylesheet" href="styles.css"><style>.box{max-width:820px;margin:auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.08)}label{display:block;font-weight:700;margin:14px 0 6px}input,textarea,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd2d8;border-radius:8px}textarea{min-height:110px}.project-list{display:grid;gap:14px;margin-top:22px}.item{border:1px solid #ddd;border-radius:12px;padding:16px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.hint{font-size:14px;color:#5b6570}.result{margin-top:16px;padding:14px;border-radius:10px;white-space:pre-wrap}.ok{background:#e9f7ef}.err{background:#fdecec}.hidden{display:none}</style></head><body><header><div class="nav"><a class="logo" href="index.html">Kutbi Aluminium Glass &amp; Hardware</a><nav><a href="index.html">Home</a><a href="project-gallery.html">Project Gallery</a><a href="admin-upload-project.html">Add Project</a><a href="manage-projects.html">Manage Projects</a></nav></div></header><main><section><div class="wrap"><div class="box"><div class="eyebrow">Kutbi Project Manager</div><h1>Edit Project</h1><p class="hint">Select a project below to edit its title, service, area, date or description. This page does not store your GitHub token.</p><label for="token">GitHub access token</label><input id="token" type="password" autocomplete="off" placeholder="github_pat_…"><div id="list" class="project-list">Loading projects…</div><div id="editor" class="hidden"><hr><h2>Edit selected project</h2><input id="index" type="hidden"><label>Project title</label><input id="title"><label>Service</label><input id="service"><label>Area</label><input id="area"><label>Project date</label><input id="date" type="date"><label>Description</label><textarea id="description"></textarea><div class="actions"><button id="save" class="btn">Save Changes</button><button id="cancel" class="btn alt">Cancel</button></div></div><div id="result" class="result" hidden></div></div></div></section></main><script>const owner='kutbiAluminiumGlassandHardware',repo='kutbiAluminiumGlassandHardware.github.io',branch='main',path='images/projects/projects.json';const token=document.getElementById('token'),list=document.getElementById('list'),editor=document.getElementById('editor'),result=document.getElementById('result');let projects=[],sha='';function show(m,ok){result.hidden=false;result.textContent=m;result.className='result '+(ok?'ok':'err')}function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}async function load(){try{const r=await fetch('https://api.github.com/repos/'+owner+'/'+repo+'/contents/'+path+'?ref='+branch+'&t='+Date.now());if(!r.ok)throw Error('Could not load projects');const d=await r.json();sha=d.sha;projects=JSON.parse(atob(d.content.replace(/\n/g,'')));render()}catch(e){list.textContent=e.message}}function render(){list.innerHTML='';projects.forEach((p,i)=>{const x=document.createElement('div');x.className='item';x.innerHTML='<strong>'+esc(p.title)+'</strong><br><span>'+esc(p.service)+' · '+esc(p.area)+'</span><div class="actions"><button data-i="'+i+'" class="edit btn">✏️ Edit</button></div>';list.appendChild(x)});document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>edit(Number(b.dataset.i)))}function edit(i){const p=projects[i];document.getElementById('index').value=i;document.getElementById('title').value=p.title||'';document.getElementById('service').value=p.service||'';document.getElementById('area').value=p.area||'';document.getElementById('date').value=p.date||'';document.getElementById('description').value=p.description||'';editor.classList.remove('hidden');window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}document.getElementById('cancel').onclick=()=>editor.classList.add('hidden');document.getElementById('save').onclick=async()=>{const t=token.value.trim();if(!t)return show('Enter your GitHub access token first.',false);const i=Number(document.getElementById('index').value);projects[i]={...projects[i],title:document.getElementById('title').value.trim(),service:document.getElementById('service').value.trim(),area:document.getElementById('area').value.trim(),date:document.getElementById('date').value,description:document.getElementById('description').value.trim()};const content=btoa(unescape(encodeURIComponent(JSON.stringify(projects,null,2)+'\n')));try{const r=await fetch('https://api.github.com/repos/'+owner+'/'+repo+'/contents/'+path,{method:'PUT',headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:'Edit Kutbi project details',content,branch,sha})});const d=await r.json();if(!r.ok)throw Error(d.message||'Save failed');sha=d.content.sha;show('✓ Project details updated successfully.',true);editor.classList.add('hidden');render()}catch(e){show('Save failed. '+e.message,false)}};load();</script></body></html>
